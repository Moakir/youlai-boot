# Redis 缓存配置模板
# 使用方法：将此配置复制到 application-{profile}.yml 中

spring:
  data:
    redis:
      database: 0
      host: localhost
      port: 6379
      password:  # 如果Redis未设置密码，留空
      timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0
  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: true
